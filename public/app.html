<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunworld — Command Center</title>
<style>
  :root{
    --bg:#faf7f1; --surface:#ffffff; --surface2:#faf8f4; --surface3:#f1ece3;
    --border:#e8e3d9; --border-soft:#f0ece4;
    --text:#1c1c1c; --muted:#5f5a52; --dim:#a39c90;
    --brand-yellow:#FFD100; --brand-ink:#1c1c1c; --brand-orange:#A63C06;
    --accent:#E4610F; --accent2:#c24e0b;
    --blue:#2563eb; --blue-bg:rgba(37,99,235,.1);
    --green:#0f9d58; --green-bg:rgba(15,157,88,.12);
    --amber:#d97706; --amber-bg:rgba(217,119,6,.13);
    --violet:#7048c4; --violet-bg:rgba(112,72,196,.11);
    --rose:#e11d63; --rose-bg:rgba(225,29,99,.1);
    --teal:#0d9488; --teal-bg:rgba(13,148,136,.11);
    --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 6px rgba(16,24,40,.06);
    --mono:'SF Mono',ui-monospace,'Menlo',monospace;
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:14px}

  /* top bar */
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 30px;background:var(--brand-yellow);border-bottom:3px solid var(--brand-ink);position:sticky;top:0;z-index:10}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-logo{height:46px;width:auto;display:block}
  .who{margin-left:auto;display:flex;align-items:center;gap:10px}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#E4610F,#c24e0b);display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
  .who .n b{font-size:12.5px;font-weight:700;display:block;line-height:1.1;color:#1c1c1c}
  .who .n small{font-size:10.5px;color:#6b5a2e}
  .tbtn{font-family:var(--sans);font-size:11.5px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid rgba(0,0,0,.2);background:rgba(255,255,255,.6);color:#1c1c1c;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .tbtn:hover{background:#fff;border-color:rgba(0,0,0,.38)}
  .tbtn svg{width:14px;height:14px}

  .wrap{max-width:1120px;margin:0 auto;padding:34px 30px 60px}
  .view{display:none;animation:fade .3s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* dashboard heading */
  .head h2{font-size:24px;font-weight:700;letter-spacing:-.03em}
  .head p{color:var(--muted);font-size:13.5px;margin-top:5px}
  .head{margin-bottom:26px}

  /* 6 service blocks */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}
  .block{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:24px;cursor:pointer;transition:transform .14s,box-shadow .2s,border-color .2s;min-height:172px;display:flex;flex-direction:column}
  .block:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(16,24,40,.11);border-color:#cfd6de}
  .block:active{transform:translateY(-1px) scale(.995)}
  .b-ic{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;margin-bottom:16px}
  .b-ic svg{width:27px;height:27px}
  .block b{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
  .block p{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .b-go{margin-top:auto;padding-top:14px;font-size:12px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:6px}
  .b-go svg{width:15px;height:15px}

  /* inside a service */
  .crumb{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer;font-weight:500;margin-bottom:20px}
  .crumb:hover{color:var(--accent)}
  .crumb svg{width:15px;height:15px}
  .svc-hero{display:flex;align-items:center;gap:18px}
  .svc-hero .h-ic{width:60px;height:60px;border-radius:15px;display:grid;place-items:center;flex-shrink:0}
  .svc-hero .h-ic svg{width:31px;height:31px}
  .svc-hero h2{font-size:26px;font-weight:700;letter-spacing:-.03em}
  .svc-hero .d{color:var(--muted);font-size:13.5px;margin-top:6px;max-width:66ch;line-height:1.55}
  .inside-note{margin-top:30px;background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:34px;text-align:center;color:var(--dim)}
  .inside-note svg{width:34px;height:34px;opacity:.5;margin-bottom:12px}
  .inside-note b{display:block;color:var(--muted);font-size:14px;font-weight:600;margin-bottom:4px}
  .inside-note span{font-size:12.5px}

  /* clients list inside a service */
  .clients-head{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 14px}
  .clients-head h3{font-size:16px;font-weight:700;letter-spacing:-.02em}
  .clients-head span{font-size:12px;color:var(--dim)}
  .clients-head .cnt{margin-right:10px}
  .sample-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:#b08900;background:rgba(255,209,0,.18);border:1px solid rgba(176,137,0,.35);padding:2px 9px;border-radius:20px;vertical-align:middle}
  .sample-tag i{width:6px;height:6px;border-radius:50%;background:#d9a400;display:inline-block}
  .clients{display:flex;flex-direction:column;gap:10px}
  .client{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:15px 18px;transition:transform .12s,box-shadow .2s,border-color .2s;cursor:pointer}
  .client:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(16,24,40,.09);border-color:#cfd6de}
  .cl-av{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:17px;flex-shrink:0}
  .cl-main{flex:1;min-width:0}
  .cl-main b{font-size:14.5px;font-weight:700;letter-spacing:-.01em;display:block}
  .cl-main p{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
  .cl-main p svg{width:13px;height:13px;color:var(--dim);flex-shrink:0}
  .cl-right{text-align:right;flex-shrink:0;display:flex;align-items:center;gap:20px}
  .cl-val{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:-.02em}
  .cl-status{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-width:78px;justify-content:flex-end}
  .cl-status .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .cl-go{color:var(--dim);flex-shrink:0}
  .cl-go svg{width:17px;height:17px}
  @media(max-width:600px){.cl-right{gap:10px}.cl-val{display:none}}

  /* client / project tracking detail */
  .client-hero{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
  .ch-top{display:flex;align-items:center;gap:16px}
  .ch-name{flex:1;min-width:0}
  .ch-name h2{font-size:22px;font-weight:800;letter-spacing:-.03em}
  .ch-name p{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
  .ch-name p svg{width:14px;height:14px;color:var(--dim);flex-shrink:0}
  .ch-facts{display:flex;flex-wrap:wrap;gap:26px;margin-top:20px;padding-top:18px;border-top:1px solid var(--border-soft)}
  .ch-facts div span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
  .ch-facts div b{display:block;font-size:13.5px;font-weight:700;margin-top:3px}
  .ch-facts .mono b{font-family:var(--mono)}
  .assign-select{font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:4px 8px;margin-top:3px;cursor:pointer;outline:none;transition:border-color .15s,box-shadow .15s;max-width:200px}
  .assign-select:hover{border-color:var(--accent)}
  .assign-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(228,97,15,.12)}
  .assign-select.sm{font-size:11.5px;padding:3px 8px;max-width:180px;margin-top:0}
  .tbtn-mini{font-family:var(--sans);font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid var(--accent);background:rgba(228,97,15,.08);color:var(--accent);cursor:pointer;transition:background .15s,color .15s}
  .tbtn-mini:hover{background:rgba(228,97,15,.16)}
  .tbtn-mini.active{background:var(--accent);color:#fff}
  .stage-assign{display:flex;align-items:center;gap:8px;margin-top:9px}
  .stage-assign span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

  /* new-project intake form (MD only) */
  .np-panel{background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
  .np-panel h4{font-size:13.5px;font-weight:700;margin-bottom:3px}
  .np-panel .np-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .np-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
  .np-grid label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .np-grid input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-family:var(--sans);font-size:13px;color:var(--text);background:var(--surface2);outline:none;transition:border-color .15s,box-shadow .15s}
  .np-grid input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(228,97,15,.12)}
  .np-submit{font-family:var(--sans);font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:9px;border:none;background:var(--accent);color:#fff;cursor:pointer;transition:background .15s}
  .np-submit:hover{background:var(--accent2)}
  @media(max-width:600px){.np-grid{grid-template-columns:1fr}}

  /* toast */
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px 18px;display:flex;align-items:center;gap:11px;z-index:50;opacity:0;transition:opacity .25s,transform .25s;box-shadow:0 14px 40px rgba(16,24,40,.16);max-width:90vw}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .ti{width:24px;height:24px;border-radius:7px;background:rgba(15,157,88,.14);display:grid;place-items:center;flex-shrink:0}
  .toast .ti svg{width:14px;height:14px}
  .toast b{font-size:12.5px;font-weight:700}
  .toast small{display:block;color:var(--dim);font-size:11px;margin-top:1px}
  .ch-note{margin-top:16px;background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.28);color:#9c5406;border-radius:10px;padding:11px 14px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:9px}
  .ch-note svg{width:16px;height:16px;flex-shrink:0}
  .track-head{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 16px}
  .track-head h3{font-size:16px;font-weight:700;letter-spacing:-.02em}
  .track-head span{font-size:12px;color:var(--dim)}
  .tracker{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:24px 26px}
  .tstep{position:relative;padding-left:34px;padding-bottom:22px}
  .tstep:last-child{padding-bottom:0}
  .tstep::before{content:'';position:absolute;left:11px;top:3px;bottom:-3px;width:2px;background:var(--border)}
  .tstep:last-child::before{display:none}
  .tstep.done::before{background:var(--green)}
  .tnode{position:absolute;left:2px;top:0;width:22px;height:22px;border-radius:50%;background:var(--surface3);border:2px solid var(--border);display:grid;place-items:center;z-index:1}
  .tnode svg{width:12px;height:12px}
  .tstep.done .tnode{background:var(--green);border-color:var(--green)}
  .tstep.current .tnode{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px rgba(228,97,15,.16)}
  .pulse{width:7px;height:7px;border-radius:50%;background:#fff}
  .tbody b{font-size:13.5px;font-weight:700}
  .tstep.todo .tbody b{color:var(--dim);font-weight:600}
  .nowtag{margin-left:8px;font-size:10px;font-weight:700;color:var(--accent);background:rgba(228,97,15,.12);padding:1px 8px;border-radius:20px;vertical-align:middle}
  .substeps{margin-top:11px;display:flex;flex-wrap:wrap;gap:6px}
  .substep{font-size:10.5px;padding:3px 10px;border-radius:20px;background:var(--surface3);color:var(--muted);font-weight:500}
  .substep.d{background:rgba(15,157,88,.13);color:var(--green)}
  .substep.a{background:rgba(228,97,15,.13);color:var(--accent);font-weight:700}

  /* live team updates feed (MD warehouse view) */
  .updates{background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:18px}
  .updates-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .updates-h .live{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
  .updates-h .live i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:lp 1.8s infinite}
  @keyframes lp{0%{box-shadow:0 0 0 0 rgba(15,157,88,.45)}70%{box-shadow:0 0 0 7px rgba(15,157,88,0)}100%{box-shadow:0 0 0 0 rgba(15,157,88,0)}}
  .updates-h .up-hint{font-size:11px;color:var(--dim)}
  .up{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--border-soft)}
  .up:first-of-type{border-top:none}
  .up-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:6px;flex-shrink:0}
  .up-txt{font-size:12.5px;color:var(--text);line-height:1.45}
  .up-time{font-size:10.5px;color:var(--dim);margin-top:2px;font-family:var(--mono)}
  .up-empty{font-size:12px;color:var(--dim);padding:6px 0;line-height:1.5}

  /* project detail panels (materials / payments / documents) */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:6px}
  .prow{display:flex;align-items:center;gap:13px;padding:12px 20px;border-bottom:1px solid var(--border-soft);font-size:12.5px}
  .prow:last-child{border-bottom:none}
  .prow .pi{width:32px;height:32px;border-radius:8px;background:var(--surface3);display:grid;place-items:center;flex-shrink:0;color:var(--muted)}
  .prow .pi svg{width:16px;height:16px}
  .prow .pn{flex:1;font-weight:600;min-width:0}
  .prow .pn small{display:block;color:var(--dim);font-weight:400;font-size:11px;margin-top:1px}
  .prow .pamt{font-family:var(--mono);font-weight:700;font-size:12.5px;margin-right:2px}
  .pstat{font-size:10.5px;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap}
  .ps-green{background:rgba(15,157,88,.13);color:var(--green)}
  .ps-amber{background:rgba(217,119,6,.14);color:var(--amber)}
  .ps-blue{background:rgba(37,99,235,.1);color:#2563eb}
  .ps-grey{background:var(--surface3);color:var(--dim)}
  .prow.pending{opacity:.55}
  .tdoc{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5;max-width:76ch}
  .tstep.todo .tdoc{color:var(--dim)}
  .doc-group-lab{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin:16px 2px 8px}
  .doc-view{font-size:11px;font-weight:600;color:var(--accent);cursor:pointer;margin-right:2px}
  .doc-view:hover{text-decoration:underline}

  /* MD overview (home roll-up) */
  .ov-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  .ov-kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:15px 16px}
  .ov-kpi .kv{font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .ov-kpi .kl{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.3}
  .ov-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:30px}
  .ov-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
  .ov-card .oh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border-soft)}
  .ov-card .oh h3{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
  .ov-card .oh .cnt{font-size:11.5px;color:var(--dim);font-family:var(--mono);font-weight:700}
  .ad{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .att{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border-soft);cursor:pointer;transition:background .12s}
  .att:last-child{border-bottom:none}
  .att:hover{background:var(--surface2)}
  .att .ad{margin-top:5px}
  .att .am{flex:1;min-width:0}
  .att .am b{font-size:12.5px;font-weight:600}
  .att .am p{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
  .att .asvc{font-size:10px;color:var(--dim);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
  .rec{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--border-soft);font-size:12.5px}
  .rec:last-child{border-bottom:none}
  .rec .rn{flex:1;font-weight:600;min-width:0}
  .rec .rn small{display:block;color:var(--dim);font-weight:400;font-size:11px;margin-top:1px}
  .rec .ra{font-family:var(--mono);font-weight:700}
  .ov-lab{font-size:13px;font-weight:700;letter-spacing:-.01em;color:var(--muted);margin:6px 2px 12px}
  @media(max-width:1000px){.ov-kpis{grid-template-columns:repeat(2,1fr)}.ov-cols{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <img src="/logo.png" alt="Sunworld Construction Engineering" class="brand-logo">
    </div>
    <div class="who">
      <button class="tbtn" onclick="resetDemo()" title="Reset the warehouse demo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg> Reset</button>
      <div class="avatar">MD</div>
      <div class="n"><b>Managing Director</b></div>
      <button class="tbtn" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg> Log out</button>
    </div>
  </div>

  <div class="wrap">
    <!-- DASHBOARD: 6 service blocks -->
    <section class="view on" id="view-dash">
      <div class="head">
        <h2>Company overview</h2>
        <p>Where Sunworld stands today — across every service.</p>
      </div>
      <div id="mdOverview"></div>

      <div class="ov-lab">Purchase Orders — Supervisor &amp; Managing Director only</div>
      <div class="panel" style="padding:16px;margin-bottom:22px">
        <label style="display:block;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Select a client to raise or view a PO for</label>
        <select id="homePoSelect" onchange="selectHomePoProject(this.value)" style="width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:9px;font-family:var(--sans);font-size:13.5px;background:var(--surface2);margin-bottom:14px">
          <option value="">Choose a client…</option>
        </select>
        <div id="homePoBody"></div>
      </div>

      <div class="ov-lab">Your Services</div>
      <div class="grid" id="grid"></div>
    </section>

    <!-- INSIDE a service -->
    <section class="view" id="view-service">
      <div id="serviceBody"></div>
    </section>
  </div>

<script>
function icon(p,stroke='currentColor',w=2){return `<svg viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`}

/* ---- Draft persistence: whatever's mid-typed in a form survives a refresh (localStorage,
   keyed by the input's own id) — cleared once the form is actually submitted successfully. ---- */
const DRAFT_PREFIX = 'sw-draft:';
function bindDrafts(root){
  if(!root) return;
  root.querySelectorAll('input[id], select[id], textarea[id]').forEach(el=>{
    if(el.type==='file') return; // browsers never let you restore a file input's value — not persistable
    const key = DRAFT_PREFIX + el.id;
    const saved = localStorage.getItem(key);
    if(saved!==null && !el.value) el.value = saved;
    const ev = el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(ev, ()=> localStorage.setItem(key, el.value));
  });
}
function clearDrafts(ids){ ids.forEach(id=>localStorage.removeItem(DRAFT_PREFIX+id)); }
function poDraftRowIds(projectId){ try{ return JSON.parse(localStorage.getItem(DRAFT_PREFIX+'po-rows-'+projectId)||'[]'); }catch{ return []; } }
function savePoDraftRowIds(projectId, ids){ localStorage.setItem(DRAFT_PREFIX+'po-rows-'+projectId, JSON.stringify(ids)); }

let WHDATA = {projects:[], updates:[]};
/* CSRF: every state-changing request must echo back this session's own token (set at boot from
   /api/me). apiFetch is a drop-in replacement for fetch() that adds it automatically. */
let CSRF = '';
function apiFetch(url, opts={}){
  opts.headers = Object.assign({}, opts.headers, CSRF ? {'X-CSRF-Token':CSRF} : {});
  return fetch(url, opts);
}

let lastSeenUpdateAt = null;
async function loadWH(){
  const r = await fetch('/api/projects');
  if(r.status===401){ location.href='/login'; return; }
  if(r.ok) WHDATA = await r.json();
  checkReadyForAssignment();

}
/* notify the MD the moment a project reaches Site Execution still unassigned (auto-detected) */
function checkReadyForAssignment(){
  const readyNow = new Set(WHDATA.projects.filter(p=>p.stage>=6 && p.team==='Unassigned').map(p=>p.id));
  if(prevReadyIds!==null){
    readyNow.forEach(id=>{
      if(!prevReadyIds.has(id)){
        const p = WHDATA.projects.find(x=>x.id===id);
        if(p) toast('Ready for assignment', `Coordinator completed setup for ${p.name} — assign a team.`);
      }
    });
  }
  prevReadyIds = readyNow;
}
/* notify the MD when a team member explicitly hits "Notify MD" (not just inferred from stage changes) */
function checkManualNotifications(){
  const ups = WHDATA.updates || [];
  const fresh = ups.filter(u=>u.notify && (lastSeenUpdateAt===null || u.at>lastSeenUpdateAt));
  if(lastSeenUpdateAt!==null){
    fresh.slice().reverse().forEach(u=>toast('Update from the team', u.text));
  }
  if(ups.length) lastSeenUpdateAt = Math.max(...ups.map(u=>u.at));
}
function timeAgo(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+'s ago';
  const m=Math.floor(s/60); if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function updatesFeedHTML(){

  const body = ups.length

    : `<div class="up-empty">No team updates yet. Open another tab, sign in as Coordinator / Site Manager / Supervisor, complete a stage — it appears here live.</div>`;
  return `<div class="updates">

}

async function createProject(serviceId){
  const name=document.getElementById('npName').value.trim();
  const site=document.getElementById('npSite').value.trim();
  const tag=document.getElementById('npTag').value.trim();
  const val=document.getElementById('npVal').value.trim();
  const delivery=document.getElementById('npDelivery').value.trim();
  if(!name || !site){ toast('Missing info', 'Client name and site are required'); return; }
  try{
    const r = await apiFetch('/api/projects/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:serviceId,name,site,tag,val,delivery})});
    const j = await r.json();
    if(!r.ok){ toast('Could not create project', j.error||'Try again'); return; }
    newProjectOpen = false;
    clearDrafts(['npName','npSite','npTag','npVal','npDelivery']);
    toast('Project created', `${name} added — Coordinator notified to set it up.`);
    await loadWH();
    renderServiceList(serviceId);
  }catch{ toast('Network error','Could not reach server'); }
}

  stopWHPoll();
  whPoll = setInterval(async ()=>{
    await loadWH();

    if(whView==='list'){ if(!newProjectOpen) renderServiceList(currentServiceId); }
    else if(whView==='client' && whClientId!=null){
      // don't blow away a PO/field/stage-name input the MD is mid-typing when the 4s poll fires
      const typingPO = document.activeElement && /^(po-|newfld-|val-|upl-)/.test(document.activeElement.id||'');
      if(!typingPO) renderClient(currentServiceId, whClientId);
    }
  }, 4000);
}
function stopWHPoll(){ if(whPoll){ clearInterval(whPoll); whPoll=null; } }

      <div style="margin-bottom:8px">${poIn(`po-vendor-address-${projectId}`,'Vendor address','width:100%')}</div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        ${poIn(`po-shipvia-${projectId}`,'Ship via','flex:1')}
        ${poIn(`po-fob-${projectId}`,'FOB','flex:1')}
        ${poIn(`po-shipterms-${projectId}`,'Shipping terms','flex:1')}
      </div>
      <div style="font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px">Items</div>
      <div id="po-items-wrap-${projectId}">${savedRows.map(i=>poItemRowHTML(projectId,i)).join('')}</div>
      <button class="tbtn-mini" style="margin-bottom:10px" onclick="addPoItemRow('${projectId}')">+ Add item</button>
      <div style="display:flex;gap:8px;align-items:center">
        ${poIn(`po-tax-${projectId}`,'Tax %','width:80px')}
        ${poIn(`po-shipfee-${projectId}`,'Shipping fee','width:110px')}
        <button class="tbtn-mini active" onclick="raisePO('${sid}','${projectId}')">Raise PO</button>
      </div>
    </div>`;
}

/* ---- MD company overview (home roll-up) ---- */
function allProjects(){ return WHDATA.projects; }
function renderOverview(){
  const el=document.getElementById('mdOverview'); if(!el) return;
  const ps=allProjects();
  const att = ps.filter(p=>p.status!=='ok')
    .map(p=>({p, sev:p.status, text:p.note || (p.status==='late'?'Delayed — delivery date at risk':'Needs attention')}))
    .sort((a,b)=>(a.sev==='late'?0:1)-(b.sev==='late'?0:1));

  el.innerHTML = `
   <div style="margin-bottom:30px">
     <div class="ov-card">
       <div class="oh"><h3><span class="ad" style="background:#dc2626"></span>Needs your attention</h3><span class="cnt">${att.length} flag${att.length!==1?'s':''}</span></div>
       ${att.length ? att.slice(0,8).map(a=>`<div class="att" onclick="goProject('${a.p.service}','${a.p.id}')"><span class="ad" style="background:${a.sev==='late'?'#dc2626':'var(--amber)'}"></span><div class="am"><b>${a.p.name}</b><p>${a.text}</p><div class="asvc">${svcById(a.p.service).name}</div></div></div>`).join('')
         : `<div class="up-empty" style="padding:16px 18px">Nothing on fire — every project is on track.</div>`}
     </div>
   </div>`;
}
let homePoll=null;
function startHomePoll(){ stopHomePoll(); homePoll=setInterval(async()=>{
  await loadWH(); renderOverview(); renderHomePoSelect();
  const typingPO = document.activeElement && /^po-/.test(document.activeElement.id||'');
  if(!typingPO) renderHomePO();
}, 5000); }
function stopHomePoll(){ if(homePoll){ clearInterval(homePoll); homePoll=null; } }

/* ---- home-page quick Purchase Order widget — raise/view a PO for any client without opening its full page ---- */
let homePoProjectId = null;
function renderHomePoSelect(){
  const sel = document.getElementById('homePoSelect'); if(!sel) return;
  const ps = allProjects();
  const prevVal = sel.value;
  sel.innerHTML = `<option value="">Choose a client…</option>` + ps.map(p=>
    `<option value="${p.id}">${p.name} — ${svcById(p.service).name}</option>`
  ).join('');
  if(ps.some(p=>p.id===prevVal)) sel.value = prevVal;
  else if(homePoProjectId && ps.some(p=>p.id===homePoProjectId)) sel.value = homePoProjectId;
  else homePoProjectId = null;
}
function selectHomePoProject(id){ homePoProjectId = id || null; renderHomePO(); }
function renderHomePO(){
  const el = document.getElementById('homePoBody'); if(!el) return;
  const p = homePoProjectId ? WHDATA.projects.find(x=>x.id===homePoProjectId) : null;
  if(!p){ el.innerHTML = `<div style="color:var(--dim);font-size:12.5px;padding:6px 2px">Pick a client above to raise or view its purchase orders.</div>`; return; }
  el.innerHTML = poHTML('home', p.id, p);
  bindDrafts(el);
}
/* open a specific project from the overview */
async function goProject(sid, projectId){
  stopHomePoll();
  currentServiceId = sid;
  await loadWH();
  whView='client'; whClientId=projectId; startWHPoll();
  assignOpen = false;
  renderClient(sid, projectId);
  document.getElementById('view-dash').classList.remove('on');
  document.getElementById('view-service').classList.add('on');
  window.scrollTo({top:0});
}

/* click a client → track that project through the process */
let assignOpen = false;
function openClient(sid, projectId){
  currentServiceId = sid;
  whView='client'; whClientId=projectId;
  assignOpen = false;
  renderClient(sid, projectId);
  window.scrollTo({top:0});
}
function toggleAssignMode(sid, projectId){ assignOpen = !assignOpen; renderClient(sid, projectId); }
function renderClient(sid, projectId){
  const s = svcById(sid);
  const c = WHDATA.projects.find(p=>p.id===projectId);
  if(!c) return;
  const h = HEALTH[c.status];
  const ma = c.moduleAssignees || {};
  const subs = s.sub==='epoxy' ? EPOXY_SUB : STEEL_SUB;
  const steps = (c.stages||[]).map((stageObj,idx)=>{
    const n = idx+1;
    const cls = n<c.stage ? 'done' : (n===c.stage ? 'current' : 'todo');
    const node = cls==='done' ? icon('<path d="M20 6 9 17l-5-5"/>','#fff',3)
               : cls==='current' ? '<span class="pulse"></span>' : '';
    let subHtml = '';
    if(stageObj.kind==='site-execution' && c.stage>=n){
      subHtml = `<div class="substeps">${subs.map((ss,si)=>{
        let sc=''; if(c.stage>n) sc='d'; else if(c.stage===n){ if(si<c.sub) sc='d'; else if(si===c.sub) sc='a'; }
        return `<span class="substep ${sc}">${si+1}. ${ss}</span>`;
      }).join('')}</div>`;
    }
    const assignHtml = assignOpen ? `<div class="stage-assign"><span>Assigned to</span><select class="assign-select sm" onchange="assignPerson('${sid}','${projectId}','${stageObj.id}',this.value)">${PEOPLE.map(pp=>`<option value="${pp}" ${pp===personFor(c,stageObj.id)?'selected':''}>${pp}</option>`).join('')}</select></div>` : '';
    const renameHtml = assignOpen ? `<button class="tbtn-mini" style="margin-left:8px" onclick="renameStage('${projectId}','${stageObj.id}','${stageObj.name.replace(/'/g,"\\'")}')">Rename</button>` : '';
    const fieldsHtml = stageFieldsHTML(sid, projectId, stageObj, assignOpen);
    return `<div class="tstep ${cls}">
      <div class="tnode">${node}</div>
      <div class="tbody"><b>${n}. ${stageObj.name}</b>${renameHtml}${n===c.stage?'<span class="nowtag">Current</span>':''}<div class="tdoc">${stageObj.desc||''}</div>${assignHtml}${subHtml}${fieldsHtml}</div>
    </div>`;
  }).join('');
  const curStageId = (c.stages[c.stage-1]||{}).id||'';
  const addStepControls = assignOpen ? `<div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="tbtn-mini" onclick="addStage('${projectId}','${curStageId}')">+ Insert step after current</button>
      <button class="tbtn-mini" onclick="addStage('${projectId}','end')">+ Add step at the end</button>
    </div>` : '';
  document.getElementById('serviceBody').innerHTML = `
    <div class="crumb" onclick="openService('${sid}')">${icon(back,'currentColor',2)} Back to ${s.name} clients</div>
    <div class="client-hero">
      <div class="ch-top">
        <div class="cl-av" style="background:${s.bg};color:${s.col};width:54px;height:54px;border-radius:13px;font-size:21px">${c.name[0]}</div>
        <div class="ch-name"><h2>${c.name}</h2><p>${icon(pin,'currentColor',2)} ${c.site} · ${c.tag}</p></div>
        <span class="cl-status" style="color:${h.c}"><span class="dot" style="background:${h.c}"></span>${h.t}</span>
      </div>
      <div class="ch-facts">
        <div class="mono"><span>Job ID</span><b>${c.id}</b></div>
        <div class="mono"><span>Contract value</span><b>${c.val}</b></div>
        <div><span>Assigned team</span>
          <select class="assign-select" onchange="assignTeam('${sid}','${projectId}',this.value)">
            ${TEAMS.map(t=>`<option value="${t}" ${t===c.team?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
        <div><span>Start</span><b>${c.start}</b></div>
        <div><span>Delivery</span><b>${c.delivery}</b></div>
        <div class="mono"><span>Progress</span><b>${c.pct}%</b></div>
      </div>
      ${c.note?`<div class="ch-note">${icon(warnI,'currentColor',2)} ${c.note}</div>`:''}
    </div>
    <div class="track-head"><h3>Project progress</h3><div style="display:flex;align-items:center;gap:12px">${moduleAssignHTML(sid,projectId,'progress',ma.progress)}<button class="tbtn-mini ${assignOpen?'active':''}" onclick="toggleAssignMode('${sid}','${projectId}')">${assignOpen?'Done assigning':'Assign'}</button></div></div>
    ${addStepControls}
    <div class="tracker">${steps}</div>

    <div class="track-head"><h3>Materials &amp; procurement</h3>${moduleAssignHTML(sid,projectId,'materials',ma.materials)}</div>
    <div class="panel">${materialsHTML(c)}</div>

    <div class="track-head"><h3>Payment milestones</h3>${moduleAssignHTML(sid,projectId,'payments',ma.payments)}</div>
    <div class="panel">${paymentsHTML(c)}</div>

    <div class="track-head"><h3>Document Center</h3>${moduleAssignHTML(sid,projectId,'documents',ma.documents)}</div>
    ${docCenterHTML(c)}

    <div class="track-head"><h3>Purchase Orders</h3><span>Supervisor &amp; Managing Director only</span></div>
    ${poHTML(sid,projectId,c)}`;
  bindDrafts(document.getElementById('serviceBody'));
}

/* toast */
let toastTimer;
function toast(title, sub){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}
  t.innerHTML=`<div class="ti">${icon('<path d="M20 6 9 17l-5-5"/>','var(--green)',2.6)}</div><div><b>${title}</b><small>${sub}</small></div>`;
  requestAnimationFrame(()=>t.classList.add('on'));
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),3200);
}

/* MD assigns a team to a project — persists for Warehouse (live), local-only for sample services */
async function assignTeam(sid, projectId, team){
  const p = WHDATA.projects.find(x=>x.id===projectId);
  try{
    const r = await apiFetch('/api/projects/'+projectId+'/assign', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({team})});
    const j = await r.json();
    if(!r.ok){ toast('Not allowed', j.error||'Could not assign team'); renderClient(sid,projectId); return; }
    if(p) p.team = team;
    WHDATA.updates = j.updates || WHDATA.updates;
    toast('Team assigned', `${team} now assigned to ${p ? p.name : projectId}`);
  }catch{ toast('Network error','Could not reach server'); }
  renderClient(sid, projectId);
}

/* MD assigns a specific person to one task/stage — persists across every service */
async function assignPerson(sid, projectId, stageId, person){
  const p = WHDATA.projects.find(x=>x.id===projectId);
  const stageObj = p && (p.stages||[]).find(x=>x.id===stageId);
  try{
    const r = await apiFetch('/api/projects/'+projectId+'/assign-stage', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({stageId,person})});
    const j = await r.json();
    if(!r.ok){ toast('Not allowed', j.error||'Could not assign'); renderClient(sid,projectId); return; }
    if(p) p.assignees = (j.project && j.project.assignees) || p.assignees || {};
    WHDATA.updates = j.updates || WHDATA.updates;
    toast('Person assigned', `${person} assigned to ${stageObj?stageObj.name:'this stage'}`);
  }catch{ toast('Network error','Could not reach server'); }
  renderClient(sid, projectId);
}

/* MD (or Supervisor) edits the process itself — insert/rename steps, define custom fields/documents */
async function addStage(projectId, afterStageId){
  const name = prompt('Name for the new process step:');
  if(!name || !name.trim()) return;
  const p = WHDATA.projects.find(x=>x.id===projectId); const sid = p ? p.service : currentServiceId;
  try{
    const r = await apiFetch('/api/projects/'+projectId+'/stage/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim(), afterStageId})});
    const j = await r.json();
    if(!r.ok){ toast('Not allowed', j.error||'Could not add step'); return; }
    toast('Step added', `"${name.trim()}" added to the process`);
    await loadWH();
  }catch{ toast('Network error','Could not reach server'); }
  renderClient(sid, projectId);
}
async function renameStage(projectId, stageId, currentName){
  const name = prompt('Rename this step:', currentName);
  if(name===null || !name.trim() || name.trim()===currentName) return;
  const p = WHDATA.projects.find(x=>x.id===projectId); const sid = p ? p.service : currentServiceId;
  try{
    const r = await apiFetch('/api/projects/'+projectId+'/stage/rename',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stageId, name:name.trim()})});
    const j = await r.json();
    if(!r.ok){ toast('Not allowed', j.error||'Could not rename'); return; }
    toast('Renamed', `Now called "${name.trim()}"`);
    await loadWH();
  }catch{ toast('Network error','Could not reach server'); }
  renderClient(sid, projectId);
}
async function addStageField(projectId, stageId){
  const labelEl = document.getElementById(`newfld-${projectId}-${stageId}`);
  const typeEl = document.getElementById(`newfldtype-${projectId}-${stageId}`);
  const label = (labelEl.value||'').trim();
  if(!label) return;
  const p = WHDATA.projects.find(x=>x.id===projectId); const sid = p ? p.service : currentServiceId;
  try{
    const r = await apiFetch('/api/projects/'+projectId+'/stage/field/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stageId, label, type:typeEl.value})});
    const j = await r.json();
    if(!r.ok){ toast('Not allowed', j.error||'Could not add field'); return; }
    toast('Added', `"${label}" added to this step`);
    clearDrafts([`newfld-${projectId}-${stageId}`]);
    await loadWH();
  }catch{ toast('Network error','Could not reach server'); }
  renderClient(sid, projectId);
}
async function saveFieldValue(projectId, stageId, fieldId){
  const el = document.getElementById(`val-${projectId}-${stageId}-${fieldId}`);
  const value = el.value;
  const p = WHDATA.projects.find(x=>x.id===projectId); const sid = p ? p.service : currentServiceId;
  try{
    const r = await apiFetch('/api/projects/'+projectId+'/stage/field/value',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stageId, fieldId, value})});
    const j = await r.json();
    if(!r.ok){ toast('Not allowed', j.error||'Could not save'); return; }
    toast('Saved', 'Field updated');
    clearDrafts([`val-${projectId}-${stageId}-${fieldId}`]);
    await loadWH();
  }catch{ toast('Network error','Could not reach server'); }
  renderClient(sid, projectId);
}
async function uploadStageFile(projectId, stageId, fieldId){
  const el = document.getElementById(`upl-${projectId}-${stageId}-${fieldId}`);
  const file = el.files && el.files[0];
  if(!file){ toast('No file chosen','Pick a file first'); return; }
  const p = WHDATA.projects.find(x=>x.id===projectId); const sid = p ? p.service : currentServiceId;
  const fd = new FormData();
  fd.append('stageId', stageId); fd.append('fieldId', fieldId); fd.append('file', file);
  try{
    const r = await apiFetch('/api/projects/'+projectId+'/stage/field/upload',{method:'POST', body:fd});
    const j = await r.json();
    if(!r.ok){ toast('Not allowed', j.error||'Could not upload'); return; }
    toast('Uploaded', `${file.name} saved`);
    await loadWH();
  }catch{ toast('Network error','Could not reach server'); }
  renderClient(sid, projectId);
}

/* MD assigns a whole work area (Project Progress / Materials / Payments / Documents) to a role */
async function assignModule(sid, projectId, module, role){
  try{
    const r = await apiFetch('/api/projects/'+projectId+'/assign-module', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({module,role})});
    const j = await r.json();
    if(!r.ok){ toast('Not allowed', j.error||'Could not assign'); renderClient(sid,projectId); return; }
    const p = WHDATA.projects.find(x=>x.id===projectId);
    if(p) p.moduleAssignees = (j.project && j.project.moduleAssignees) || p.moduleAssignees || {};
    WHDATA.updates = j.updates || WHDATA.updates;
    toast(role?'Work area assigned':'Work area unassigned', role?`${MODULE_LABEL[module]} assigned to ${ROLE_LABEL[role]}`:`${MODULE_LABEL[module]} is now unassigned`);
  }catch{ toast('Network error','Could not reach server'); }
  renderClient(sid, projectId);
}

/* MD (or Supervisor) raises a purchase order against a vendor — collects vendor/ship/item fields */
function collectPoItems(projectId){
  return Array.from(document.querySelectorAll(`#po-items-wrap-${projectId} .po-item-row`)).map(row=>{
    const i = row.dataset.i;
    return {
      name: (document.getElementById(`po-it-name-${projectId}-${i}`)?.value||'').trim(),
      desc: (document.getElementById(`po-it-desc-${projectId}-${i}`)?.value||'').trim(),
      qty: document.getElementById(`po-it-qty-${projectId}-${i}`)?.value||0,
      unitPrice: document.getElementById(`po-it-price-${projectId}-${i}`)?.value||0
    };
  }).filter(it=>it.name);
}
async function raisePO(sid, projectId){
  const g = id => (document.getElementById(id)?.value||'').trim();
  const vendorName = g(`po-vendor-name-${projectId}`);
  const items = collectPoItems(projectId);
  if(!vendorName || !items.length){ toast('Missing details','Vendor name and at least one item are required'); return; }
  const body = {
    vendor: { name:vendorName, phone:g(`po-vendor-phone-${projectId}`), email:g(`po-vendor-email-${projectId}`), address:g(`po-vendor-address-${projectId}`) },
    shipVia: g(`po-shipvia-${projectId}`), fob: g(`po-fob-${projectId}`), shippingTerms: g(`po-shipterms-${projectId}`),
    taxPercent: g(`po-tax-${projectId}`), shippingFee: g(`po-shipfee-${projectId}`),
    items
  };
  try{
    const r = await apiFetch('/api/projects/'+projectId+'/po/create', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    if(!r.ok){ toast('Not allowed', j.error||'Could not raise PO'); return; }
    WHDATA.updates = j.updates || WHDATA.updates;
    const poId = j.project.po[j.project.po.length-1].id;
    if(j.email && j.email.sent) toast('PO raised & emailed', `${poId} sent to ${vendorName}'s inbox`);
    else toast('PO raised', `${poId} created — email not sent (${(j.email&&j.email.reason)||'no vendor email'})`);
    clearPoDraft(projectId);
  }catch{ toast('Network error','Could not reach server'); }
  await loadWH();
  if(sid==='home') renderHomePO(); else renderClient(sid, projectId);
}
function clearPoDraft(projectId){
  const rowIds = poDraftRowIds(projectId);
  const fieldIds = [`po-vendor-name-${projectId}`,`po-vendor-phone-${projectId}`,`po-vendor-email-${projectId}`,`po-vendor-address-${projectId}`,`po-shipvia-${projectId}`,`po-fob-${projectId}`,`po-shipterms-${projectId}`,`po-tax-${projectId}`,`po-shipfee-${projectId}`];
  rowIds.forEach(i=>fieldIds.push(`po-it-name-${projectId}-${i}`,`po-it-desc-${projectId}-${i}`,`po-it-qty-${projectId}-${i}`,`po-it-price-${projectId}-${i}`));
  clearDrafts(fieldIds);
  localStorage.removeItem(DRAFT_PREFIX+'po-rows-'+projectId);
}
async function advancePO(sid, projectId, poId){
  try{
    const r = await apiFetch('/api/projects/'+projectId+'/po/status', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({poId})});
    const j = await r.json();
    if(!r.ok){ toast('Not allowed', j.error||'Could not update PO'); return; }
    WHDATA.updates = j.updates || WHDATA.updates;
  }catch{ toast('Network error','Could not reach server'); }
  await loadWH();
  if(sid==='home') renderHomePO(); else renderClient(sid, projectId);
}

function logout(){ apiFetch('/api/logout',{method:'POST'}).finally(()=>{location.href='/login';}); }

async function init(){
  try{ const me = await fetch('/api/me'); if(me.ok){ CSRF = (await me.json()).csrf || ''; } }catch{}
  renderGrid();
  await loadWH();
  renderOverview();
  renderHomePoSelect();
  renderHomePO();
  startHomePoll();
}
init();
